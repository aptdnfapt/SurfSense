version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-surfsense}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: ghcr.io/${GITHUB_REPO_OWNER:-surfsense}/surfsense_backend:${BACKEND_IMAGE_TAG:-latest}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-surfsense}
      - SECRET_KEY=${SECRET_KEY}
      - NEXT_FRONTEND_URL=${NEXT_FRONTEND_URL:-http://localhost:3000}
      - AUTH_TYPE=${AUTH_TYPE:-LOCAL}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      - GOOGLE_CALENDAR_REDIRECT_URI=${GOOGLE_CALENDAR_REDIRECT_URI:-http://localhost:8000/api/v1/auth/google/calendar/connector/callback}
      - GOOGLE_GMAIL_REDIRECT_URI=${GOOGLE_GMAIL_REDIRECT_URI:-http://localhost:8000/api/v1/auth/google/gmail/connector/callback}
      - AIRTABLE_CLIENT_ID=${AIRTABLE_CLIENT_ID:-}
      - AIRTABLE_CLIENT_SECRET=${AIRTABLE_CLIENT_SECRET:-}
      - AIRTABLE_REDIRECT_URI=${AIRTABLE_REDIRECT_URI:-http://localhost:8000/api/v1/auth/airtable/connector/callback}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-mixedbread-ai/mxbai-embed-large-v1}
      - RERANKERS_MODEL_NAME=${RERANKERS_MODEL_NAME:-ms-marco-MiniLM-L-12-v2}
      - RERANKERS_MODEL_TYPE=${RERANKERS_MODEL_TYPE:-flashrank}
      - TTS_SERVICE=${TTS_SERVICE:-local/kokoro}
      - TTS_SERVICE_API_KEY=${TTS_SERVICE_API_KEY:-}
      - TTS_SERVICE_API_BASE=${TTS_SERVICE_API_BASE:-}
      - STT_SERVICE=${STT_SERVICE:-}
      - STT_SERVICE_API_KEY=${STT_SERVICE_API_KEY:-}
      - STT_SERVICE_API_BASE=${STT_SERVICE_API_BASE:-}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
      - ETL_SERVICE=${ETL_SERVICE:-UNSTRUCTURED}
      - UNSTRUCTURED_API_KEY=${UNSTRUCTURED_API_KEY:-}
      - LLAMA_CLOUD_API_KEY=${LLAMA_CLOUD_API_KEY:-}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - LANGSMITH_ENDPOINT=${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-surfsense}
      - UVICORN_HOST=${UVICORN_HOST:-0.0.0.0}
      - UVICORN_PORT=${UVICORN_PORT:-8000}
      - UVICORN_LOG_LEVEL=${UVICORN_LOG_LEVEL:-info}
      - PYTHONPATH=/app
      - UVICORN_LOOP=asyncio
      - MODEL_PATH=/app/models
    volumes:
      - backend_models:/app/models
      - backend_hf_cache:/root/.cache/huggingface
    restart: unless-stopped

  frontend:
    image: ghcr.io/${GITHUB_REPO_OWNER:-surfsense}/surfsense_frontend:latest
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_FASTAPI_BACKEND_URL=http://backend:8000
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-admin@surfsense.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:-surfsense}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
  backend_models:
  backend_hf_cache:
